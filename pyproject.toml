[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rio-os"
version = "0.2.1-dev"
description = "R.I.O. - Reasoning Intelligence Orchestration: Personal AI Operating System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "openai>=1.14.0",
    "anthropic>=0.19.0",
    "google-generativeai>=0.4.0",
    "numpy>=1.26.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "playwright>=1.42.0",
    "Pillow>=10.2.0",
    "rich>=13.7.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[project.scripts]
rio = "apps.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*", "agents*", "apps*", "runtime*", "voice*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
